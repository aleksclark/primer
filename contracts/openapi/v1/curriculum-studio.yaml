openapi: 3.1.0
info:
  title: Curriculum Studio Authoring API
  version: 1.0.0
  description: |
    Browser and public authoring HTTP API for Curriculum Studio.

    **Contract ownership:** this OpenAPI document is the source of truth for
    authoring REST. Primer and other services consume the gRPC API in
    `contracts/proto/curriculumstudio/v1/`. Integration payloads
    (`MaterializationContext`, `MaterializationBundle`, `DomainEvent`) are
    defined only in protobuf and are not restated here.

    Authentication is a bearer token issued by a separate identity service,
    or a scoped service credential. Curriculum Studio does not store passwords.
  license:
    name: Proprietary
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
  - url: /studio/v1
    description: Versioned Curriculum Studio authoring prefix.
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Workspaces
  - name: Curricula
  - name: Revisions
  - name: Graph
  - name: Standards
  - name: Resources
  - name: Validation
  - name: Materializations
  - name: Items
  - name: Exports
  - name: Webhooks
  - name: Events
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [Workspaces]
      summary: List workspaces
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Dir"
      responses:
        "200":
          description: Page of workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkspace
      tags: [Workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      tags: [Workspaces]
      summary: Get a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWorkspace
      tags: [Workspaces]
      summary: Update a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/curricula:
    get:
      operationId: listCurricula
      tags: [Curricula]
      summary: List curricula in a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Dir"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CurriculumStatus"
      responses:
        "200":
          description: Page of curricula.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCurriculum
      tags: [Curricula]
      summary: Create a curriculum identity
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumCreate"
      responses:
        "201":
          description: Created, including an empty draft revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curriculum"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /curricula/{curriculumId}:
    get:
      operationId: getCurriculum
      tags: [Curricula]
      summary: Get a curriculum
      parameters:
        - $ref: "#/components/parameters/CurriculumId"
      responses:
        "200":
          description: Curriculum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curriculum"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCurriculum
      tags: [Curricula]
      summary: Update curriculum identity fields
      parameters:
        - $ref: "#/components/parameters/CurriculumId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curriculum"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /curricula/{curriculumId}/revisions:
    get:
      operationId: listRevisions
      tags: [Revisions]
      summary: List plan revisions
      parameters:
        - $ref: "#/components/parameters/CurriculumId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/RevisionState"
      responses:
        "200":
          description: Page of revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRevisionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRevision
      tags: [Revisions]
      summary: Create a draft revision
      description: Optionally forks an existing published revision into a new draft.
      parameters:
        - $ref: "#/components/parameters/CurriculumId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionCreate"
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /revisions/{revisionId}:
    get:
      operationId: getRevision
      tags: [Revisions]
      summary: Get a plan revision
      parameters:
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "200":
          description: Revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRevision
      tags: [Revisions]
      summary: Update a draft revision brief
      description: Published revisions are immutable and return 409 revision_immutable.
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionUpdate"
      responses:
        "200":
          description: Updated draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /revisions/{revisionId}/publish:
    post:
      operationId: publishRevision
      tags: [Revisions]
      summary: Publish a draft as an immutable revision
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Published revision (idempotent replay of the same key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /revisions/{revisionId}/validate:
    post:
      operationId: validateRevision
      tags: [Validation]
      summary: Run deterministic validation against a revision
      parameters:
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "200":
          description: Validation report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /revisions/{revisionId}/graph:
    get:
      operationId: getRevisionGraph
      tags: [Graph]
      summary: Get the revision plan graph
      parameters:
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "200":
          description: Graph snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanGraph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceRevisionGraph
      tags: [Graph]
      summary: Replace a draft revision graph
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanGraphWrite"
      responses:
        "200":
          description: Replaced graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanGraph"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /revisions/{revisionId}/nodes:
    post:
      operationId: createPlanNode
      tags: [Graph]
      summary: Add a node to a draft graph
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanNodeWrite"
      responses:
        "201":
          description: Node created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /revisions/{revisionId}/nodes/{nodeId}:
    patch:
      operationId: updatePlanNode
      tags: [Graph]
      summary: Update a draft graph node
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanNodeWrite"
      responses:
        "200":
          description: Node updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
    delete:
      operationId: deletePlanNode
      tags: [Graph]
      summary: Delete a draft graph node
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /revisions/{revisionId}/edges:
    post:
      operationId: createPlanEdge
      tags: [Graph]
      summary: Add an edge to a draft graph
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanEdgeWrite"
      responses:
        "201":
          description: Edge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanEdge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /revisions/{revisionId}/edges/{edgeId}:
    delete:
      operationId: deletePlanEdge
      tags: [Graph]
      summary: Delete a draft graph edge
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - $ref: "#/components/parameters/EdgeId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /workspaces/{workspaceId}/standards-catalogs:
    get:
      operationId: listStandardsCatalogs
      tags: [Standards]
      summary: List standards catalogs
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of catalogs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardsCatalogPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: importStandardsCatalog
      tags: [Standards]
      summary: Import or create a standards catalog
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandardsCatalogImport"
      responses:
        "201":
          description: Catalog created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardsCatalog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /standards-catalogs/{catalogId}:
    get:
      operationId: getStandardsCatalog
      tags: [Standards]
      summary: Get a standards catalog
      parameters:
        - $ref: "#/components/parameters/CatalogId"
      responses:
        "200":
          description: Catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardsCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /standards-catalogs/{catalogId}/standards:
    get:
      operationId: listStandards
      tags: [Standards]
      summary: List standards in a catalog
      parameters:
        - $ref: "#/components/parameters/CatalogId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: subject
          in: query
          schema:
            type: string
        - name: grade
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Page of standards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createStandard
      tags: [Standards]
      summary: Add a custom standard
      parameters:
        - $ref: "#/components/parameters/CatalogId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandardWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Standard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /standards/{standardId}:
    get:
      operationId: getStandard
      tags: [Standards]
      summary: Get a standard
      parameters:
        - $ref: "#/components/parameters/StandardId"
      responses:
        "200":
          description: Standard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Standard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /standards-catalogs/{catalogId}/crosswalks:
    get:
      operationId: listStandardCrosswalks
      tags: [Standards]
      summary: List standard crosswalks
      parameters:
        - $ref: "#/components/parameters/CatalogId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of crosswalks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardCrosswalkPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/resources:
    get:
      operationId: listResources
      tags: [Resources]
      summary: List curated resources
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ResourceKind"
      responses:
        "200":
          description: Page of resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createResource
      tags: [Resources]
      summary: Create a resource reference
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /resources/{resourceId}:
    get:
      operationId: getResource
      tags: [Resources]
      summary: Get a resource
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateResource
      tags: [Resources]
      summary: Update a resource
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteResource
      tags: [Resources]
      summary: Delete a resource reference
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /revisions/{revisionId}/materializations:
    get:
      operationId: listMaterializations
      tags: [Materializations]
      summary: List materialization runs for a revision
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MaterializationStatus"
      responses:
        "200":
          description: Page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterializationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createMaterialization
      tags: [Materializations]
      summary: Start an authoring materialization
      description: |
        Standalone authoring entry point. Primer LMS callers must use the
        gRPC `CurriculumIntegrationService.Materialize` RPC with proto
        `MaterializationContext` instead of this route.
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoringMaterializeRequest"
      responses:
        "202":
          description: Run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Materialization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /materializations/{materializationId}:
    get:
      operationId: getMaterialization
      tags: [Materializations]
      summary: Get materialization status
      parameters:
        - $ref: "#/components/parameters/MaterializationId"
      responses:
        "200":
          description: Run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Materialization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /materializations/{materializationId}/bundle:
    get:
      operationId: getMaterializationBundle
      tags: [Materializations]
      summary: Get the ready authoring bundle summary
      description: |
        Authoring view of produced sessions. The Primer JSON session bundle
        is the proto `MaterializationBundle` returned by
        `GetMaterializationBundle`.
      parameters:
        - $ref: "#/components/parameters/MaterializationId"
      responses:
        "200":
          description: Bundle summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringBundle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /materializations/{materializationId}/items:
    get:
      operationId: listMaterializedItems
      tags: [Items]
      summary: List generated items
      parameters:
        - $ref: "#/components/parameters/MaterializationId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/MaterializedItemKind"
        - name: lockState
          in: query
          schema:
            $ref: "#/components/schemas/ItemLockState"
      responses:
        "200":
          description: Page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterializedItemPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /materialized-items/{itemId}:
    get:
      operationId: getMaterializedItem
      tags: [Items]
      summary: Get a generated item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterializedItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMaterializedItem
      tags: [Items]
      summary: Edit an unlocked generated item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterializedItemUpdate"
      responses:
        "200":
          description: Updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterializedItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /materialized-items/{itemId}/lock:
    post:
      operationId: lockMaterializedItem
      tags: [Items]
      summary: Lock an item against rematerialize overwrite
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Locked item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterializedItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /materialized-items/{itemId}/unlock:
    post:
      operationId: unlockMaterializedItem
      tags: [Items]
      summary: Unlock an item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Unlocked item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterializedItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /revisions/{revisionId}/exports:
    post:
      operationId: createExport
      tags: [Exports]
      summary: Start an export job
      parameters:
        - $ref: "#/components/parameters/RevisionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportCreate"
      responses:
        "202":
          description: Export accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /exports/{exportId}:
    get:
      operationId: getExport
      tags: [Exports]
      summary: Get an export job
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Export job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/webhooks:
    get:
      operationId: listWebhookEndpoints
      tags: [Webhooks]
      summary: List webhook endpoints
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createWebhookEndpoint
      tags: [Webhooks]
      summary: Register a webhook endpoint
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /webhooks/{webhookId}:
    get:
      operationId: getWebhookEndpoint
      tags: [Webhooks]
      summary: Get a webhook endpoint
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      responses:
        "200":
          description: Endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWebhookEndpoint
      tags: [Webhooks]
      summary: Update a webhook endpoint
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWebhookEndpoint
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /webhooks/{webhookId}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: List deliveries for an endpoint
      parameters:
        - $ref: "#/components/parameters/WebhookId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/events:
    get:
      operationId: listWorkspaceEvents
      tags: [Events]
      summary: List domain events for a workspace
      description: |
        Authoring audit stream. Primer should pull typed events over gRPC
        `PullEvents` or subscribe via webhook. Event type names match proto
        `EventType` without the `EVENT_TYPE_` prefix, lower_snake_case.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/EventTypeName"
      responses:
        "200":
          description: Page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainEventPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token issued by the separate auth/identity service. Studio
        validates signature, expiry, and workspace/service scopes. Studio
        never issues passwords or stores password hashes.
    serviceCredential:
      type: apiKey
      in: header
      name: X-Service-Token
      description: |
        Scoped service credential for machine callers. Also accepted as
        `Authorization: Bearer` when the token is a service credential
        (same presentation rule as the LMS SharedSecretGuard).
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
        default: 25
    Offset:
      name: offset
      in: query
      description: Rows to skip.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    Q:
      name: q
      in: query
      description: Free-text search.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: Whitelisted sort column.
      schema:
        type: string
    Dir:
      name: dir
      in: query
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ws_[A-Za-z0-9]+$"
    CurriculumId:
      name: curriculumId
      in: path
      required: true
      schema:
        type: string
        pattern: "^cur_[A-Za-z0-9]+$"
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^prev_[A-Za-z0-9]+$"
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
    EdgeId:
      name: edgeId
      in: path
      required: true
      schema:
        type: string
    CatalogId:
      name: catalogId
      in: path
      required: true
      schema:
        type: string
        pattern: "^cat_[A-Za-z0-9]+$"
    StandardId:
      name: standardId
      in: path
      required: true
      schema:
        type: string
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        pattern: "^res_[A-Za-z0-9]+$"
    MaterializationId:
      name: materializationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^mat_[A-Za-z0-9]+$"
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        pattern: "^itm_[A-Za-z0-9]+$"
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        pattern: "^exp_[A-Za-z0-9]+$"
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        pattern: "^wh_[A-Za-z0-9]+$"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Draft etag. Required for draft mutations.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-supplied idempotency key for publish, materialize, and export.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: Invalid argument.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    Conflict:
      description: |
        Conflict: immutable revision, locked item, duplicate slug, or
        idempotency-key reuse with a different body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    PreconditionFailed:
      description: If-Match etag did not match.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    Unprocessable:
      description: Deterministic validation failed; publish refused.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    ErrorCode:
      type: string
      description: Machine-readable application code. Mirrors proto ErrorCode.
      enum:
        - unauthenticated
        - permission_denied
        - not_found
        - already_exists
        - failed_precondition
        - aborted
        - invalid_argument
        - resource_locked
        - revision_immutable
        - validation_failed
        - materialization_failed
        - idempotency_key_conflict
        - quota_exceeded
        - internal
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        location:
          type: string
          description: Field path such as body.learnerLevel or path.revisionId.
        message:
          type: string
        value: {}
    ErrorModel:
      type: object
      additionalProperties: false
      required: [status, title, code]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int64
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          $ref: "#/components/schemas/ErrorCode"
        errors:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ErrorDetail"
    PageMeta:
      type: object
      additionalProperties: false
      required: [items, totalCount, limit, offset]
      properties:
        totalCount:
          type: integer
          format: int64
          description: Total rows matching the query, ignoring pagination.
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
    WorkspaceUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        slug:
          type: string
    WorkspacePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/Workspace"
    CurriculumTemplate:
      type: string
      enum:
        - homeschool_year
        - single_subject
        - classroom_semester
        - project_based_unit
        - standards_remediation
        - custom
    CurriculumStatus:
      type: string
      enum: [active, archived]
    Curriculum:
      type: object
      additionalProperties: false
      required: [id, workspaceId, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        description:
          type: string
        template:
          $ref: "#/components/schemas/CurriculumTemplate"
        status:
          $ref: "#/components/schemas/CurriculumStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CurriculumCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        template:
          $ref: "#/components/schemas/CurriculumTemplate"
        brief:
          $ref: "#/components/schemas/CurriculumBrief"
    CurriculumUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/CurriculumStatus"
    CurriculumPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/Curriculum"
    RevisionState:
      type: string
      enum: [draft, published, superseded]
    CurriculumBrief:
      type: object
      additionalProperties: false
      properties:
        learnerLevel:
          type: string
        subjects:
          type:
            - array
            - "null"
          items:
            type: string
        timeHorizon:
          type: string
        academicGoals:
          type:
            - array
            - "null"
          items:
            type: string
        standardsJurisdiction:
          type: string
        availableMinutesPerWeek:
          type: integer
          format: int32
        resourceIds:
          type:
            - array
            - "null"
          items:
            type: string
        desiredProjects:
          type:
            - array
            - "null"
          items:
            type: string
        testingRequirements:
          type:
            - array
            - "null"
          items:
            type: string
        philosophy:
          type: string
    PlanRevision:
      type: object
      additionalProperties: false
      required: [id, curriculumId, state, etag, createdAt, updatedAt]
      properties:
        id:
          type: string
        curriculumId:
          type: string
        revisionNumber:
          type: integer
          format: int32
          description: Assigned on publish. Zero on drafts.
        state:
          $ref: "#/components/schemas/RevisionState"
        brief:
          $ref: "#/components/schemas/CurriculumBrief"
        etag:
          type: string
        publishedBy:
          type: string
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RevisionCreate:
      type: object
      additionalProperties: false
      properties:
        forkFromRevisionId:
          type: string
          description: Published revision to copy into the new draft.
        brief:
          $ref: "#/components/schemas/CurriculumBrief"
    RevisionUpdate:
      type: object
      additionalProperties: false
      properties:
        brief:
          $ref: "#/components/schemas/CurriculumBrief"
    PlanRevisionPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/PlanRevision"
    NodeKind:
      type: string
      enum:
        - objective
        - outcome
        - learning_arc
        - unit
        - project
        - lesson_slot
        - evidence_requirement
        - assessment_plan
        - scheduling_policy
    EdgeKind:
      type: string
      enum:
        - parent_child
        - prerequisite
        - addresses_standard
        - uses_resource
        - produces_evidence
        - sequence
    PlanNode:
      type: object
      additionalProperties: false
      required: [id, revisionId, kind, title, position]
      properties:
        id:
          type: string
        revisionId:
          type: string
        kind:
          $ref: "#/components/schemas/NodeKind"
        title:
          type: string
        body:
          type: string
        standardCodes:
          type:
            - array
            - "null"
          items:
            type: string
        estimatedMinutes:
          type: integer
          format: int32
        position:
          type: integer
          format: int32
        attributes:
          type: object
          additionalProperties:
            type: string
    PlanNodeWrite:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        kind:
          $ref: "#/components/schemas/NodeKind"
        title:
          type: string
        body:
          type: string
        standardCodes:
          type:
            - array
            - "null"
          items:
            type: string
        estimatedMinutes:
          type: integer
          format: int32
        position:
          type: integer
          format: int32
        attributes:
          type: object
          additionalProperties:
            type: string
    PlanEdge:
      type: object
      additionalProperties: false
      required: [id, revisionId, kind, fromNodeId, toNodeId]
      properties:
        id:
          type: string
        revisionId:
          type: string
        kind:
          $ref: "#/components/schemas/EdgeKind"
        fromNodeId:
          type: string
        toNodeId:
          type: string
        note:
          type: string
    PlanEdgeWrite:
      type: object
      additionalProperties: false
      required: [kind, fromNodeId, toNodeId]
      properties:
        kind:
          $ref: "#/components/schemas/EdgeKind"
        fromNodeId:
          type: string
        toNodeId:
          type: string
        note:
          type: string
    PlanGraph:
      type: object
      additionalProperties: false
      required: [revisionId, nodes, edges, etag]
      properties:
        revisionId:
          type: string
        nodes:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/PlanNode"
        edges:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/PlanEdge"
        etag:
          type: string
    PlanGraphWrite:
      type: object
      additionalProperties: false
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/PlanNodeWrite"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/PlanEdgeWrite"
    ValidationSeverity:
      type: string
      enum: [info, warning, error]
    ValidationRule:
      type: string
      enum:
        - standard_exists
        - prerequisite_acyclic
        - outcome_has_evidence
        - item_traces_to_node
        - revision_immutable
        - locked_content_preserved
        - materialization_snapshot_complete
        - assessment_has_key_or_rubric
        - coverage_gap
        - workload_overload
        - unassessed_outcome
    ValidationFinding:
      type: object
      additionalProperties: false
      required: [rule, severity, message]
      properties:
        rule:
          $ref: "#/components/schemas/ValidationRule"
        severity:
          $ref: "#/components/schemas/ValidationSeverity"
        message:
          type: string
        nodeIds:
          type:
            - array
            - "null"
          items:
