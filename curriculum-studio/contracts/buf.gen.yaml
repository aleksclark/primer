# Code generation is a local/CI build step. Generated sources are not committed.
# Pin: Buf CLI 1.72.x (workspace; C3 qualifies exact `buf --version`).
# Production-intended path (C3/C4): `buf generate` with the remote plugins below.
# C3 spikes invoke this config in an isolated temp copy — not host protoc.
# Exact pins: protoc-gen-go v1.36.11, protoc-gen-go-grpc v1.5.1.
version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt:
      - paths=source_relative
inputs:
  - directory: proto
