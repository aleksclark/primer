# Primer Tasks development stack.
#
# Host publishes are deliberately loopback + ephemeral. Stacklane maps the
# assigned loopback ports to its durable VIP; direct loopback URLs remain a
# useful fallback when Stacklane is unavailable.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: primer_tasks
      POSTGRES_USER: tasks
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - tasks_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d primer_tasks"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${TASKS_S3_ACCESS_KEY-minioadmin}
      MINIO_ROOT_PASSWORD: ${TASKS_S3_SECRET_KEY-minioadmin-change-me}
    volumes:
      - tasks_object_data:/data
    ports:
      - "127.0.0.1::9000"
    labels:
      stacklane.enable: "true"
      stacklane.project: "primer-tasks"
      stacklane.instance: "${STACKLANE_INSTANCE:-dev}"
      stacklane.endpoint: "object-store"
      stacklane.port: "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  issuer-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: primer_tasks_issuer
      POSTGRES_USER: tasks_issuer
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - tasks_issuer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks_issuer -d primer_tasks_issuer"]
      interval: 5s
      timeout: 3s
      retries: 12

  test-issuer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /src
    entrypoint: [""]
    command: ["go", "run", "./cmd/tasks-test-issuer"]
    environment:
      TASKS_TEST_ISSUER_HOST: "0.0.0.0"
      TASKS_TEST_ISSUER_PORT: "8091"
      TASKS_TEST_ISSUER_URL: ${TASKS_PUBLIC_ISSUER_URL-http://test-issuer.${STACKLANE_INSTANCE:-dev}.primer-tasks.${STACKLANE_BASE_DOMAIN:-test}}
      TASKS_TEST_PRINCIPAL: ${TASKS_TEST_PRINCIPAL-parent-a}
      TASKS_TEST_ISSUER_DATABASE_URL: postgres://tasks_issuer@issuer-postgres:5432/primer_tasks_issuer?sslmode=disable
    volumes:
      - .:/src
      - tasks_go_mod_cache:/go/pkg/mod
      - tasks_go_build_cache:/root/.cache/go-build
    depends_on:
      issuer-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1::8091"
    labels:
      stacklane.enable: "true"
      stacklane.project: "primer-tasks"
      stacklane.instance: "${STACKLANE_INSTANCE:-dev}"
      stacklane.endpoint: "test-issuer"
      stacklane.port: "8091"
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /src
    entrypoint: [""]
    command: ["go", "run", "./cmd/tasks-migrate", "up"]
    environment:
      TASKS_DATABASE_URL: postgres://tasks@postgres:5432/primer_tasks?sslmode=disable
      TASKS_ENV: ${TASKS_ENV-development}
    volumes:
      - .:/src
      - tasks_go_mod_cache:/go/pkg/mod
      - tasks_go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /src
    command: ["air", "-c", ".air.toml"]
    environment:
      TASKS_HOST: "0.0.0.0"
      TASKS_PORT: "8080"
      TASKS_ENV: ${TASKS_ENV-development}
      # Development defaults to the narrow local test-auth seam. Production
      # must supply TASKS_AUTH_MODE=jwks and a real TASKS_ISSUER_URL; the
      # server exits before listening when production is misconfigured.
      TASKS_AUTH_MODE: ${TASKS_AUTH_MODE-test}
      TASKS_MODEL_PROVIDER: ${TASKS_MODEL_PROVIDER-disabled}
      # The scripted Fantasy fixture is a deliberate development override;
      # production must supply a real provider and never accepts this mode.
      TASKS_AGENT_MODE: ${TASKS_AGENT_MODE-${TASKS_MODEL_PROVIDER-disabled}}
      TASKS_AGENT_SCRIPTED_DELAY_MS: ${TASKS_AGENT_SCRIPTED_DELAY_MS-0}
      # Development-only dialogue failure modes exercise durable retry without
      # allowing a scripted response to claim completion.
      TASKS_AGENT_SCRIPTED_DIALOGUE_FAULT: ${TASKS_AGENT_SCRIPTED_DIALOGUE_FAULT-}
      # Explicit non-sensitive scripted multimodal fixture qualification only;
      # production and ordinary development remain disabled by default.
      TASKS_ARTIFACT_SCRIPTED_FIXTURE: ${TASKS_ARTIFACT_SCRIPTED_FIXTURE-}
      # The fixture digest binds scripted acceptance to the checked-in
      # non-sensitive image fixture; arbitrary images route to review.
      TASKS_ARTIFACT_SCRIPTED_DIGEST: ${TASKS_ARTIFACT_SCRIPTED_DIGEST-ef6540c36463aecbff0316212f399143335e74dba8413f0675279b9c42ecc3cb}
      TASKS_ARTIFACT_SCRIPTED_OUTCOME: ${TASKS_ARTIFACT_SCRIPTED_OUTCOME-}
      TASKS_ARTIFACT_SCRIPTED_FAULT: ${TASKS_ARTIFACT_SCRIPTED_FAULT-}
      # Parent agent tooling is explicit and server-owned. Empty/unknown values
      # fail closed in parent.ProviderConfig; this development default is only
      # used when a scripted qualification run is deliberately enabled.
      TASKS_AGENT_ACTIVE_TOOLS: ${TASKS_AGENT_ACTIVE_TOOLS-list_students,list_tasks,get_task,draft_task,update_task,publish_task,preview_action,confirm_action,list_schedules,create_schedule,update_schedule,list_occurrences}
      TASKS_SCHEDULE_HORIZON_DAYS: ${TASKS_SCHEDULE_HORIZON_DAYS-365}
      # The test issuer is a Compose-DNS address. Override this with the live
      # Identity issuer and TASKS_AUTH_MODE=oidc for a real authorization flow.
      TASKS_ISSUER_URL: ${TASKS_ISSUER_URL-http://test-issuer:8091}
      # Browser test authorization is sent through web's /issuer proxy; this
      # stable public issuer value must match the test issuer's signed `iss`.
      TASKS_PUBLIC_ISSUER_URL: ${TASKS_PUBLIC_ISSUER_URL-http://test-issuer.${STACKLANE_INSTANCE:-dev}.primer-tasks.${STACKLANE_BASE_DOMAIN:-test}}
      TASKS_OIDC_CLIENT_ID: ${TASKS_OIDC_CLIENT_ID-primer-tasks-web}
      TASKS_OIDC_REDIRECT_URL: ${TASKS_OIDC_REDIRECT_URL-http://web.${STACKLANE_INSTANCE:-dev}.primer-tasks.${STACKLANE_BASE_DOMAIN:-test}:${STACKLANE_WEB_PUBLIC_PORT:-5173}/auth/callback}
      TASKS_TEST_PRINCIPAL: ${TASKS_TEST_PRINCIPAL-parent-a}
      TASKS_TEST_ISSUER_SECRET: ${TASKS_TEST_ISSUER_SECRET-primer-tasks-test-issuer-secret}
      TASKS_DATABASE_URL: postgres://tasks@postgres:5432/primer_tasks?sslmode=disable
      TASKS_PUBLIC_ORIGIN: ${TASKS_PUBLIC_ORIGIN-http://web.${STACKLANE_INSTANCE:-dev}.primer-tasks.${STACKLANE_BASE_DOMAIN:-test}:${STACKLANE_WEB_PUBLIC_PORT:-5173}}
      TASKS_ALLOWED_ORIGINS: ${TASKS_ALLOWED_ORIGINS-http://web.${STACKLANE_INSTANCE:-dev}.primer-tasks.${STACKLANE_BASE_DOMAIN:-test}:${STACKLANE_WEB_PUBLIC_PORT:-5173},http://127.0.0.1}
      TASKS_ARTIFACT_STORE_DIR: /var/lib/primer-tasks/artifacts
      # Server-side media validation only; browser MIME/duration metadata is
      # never authoritative. Dockerfile.dev installs both binaries.
      TASKS_FFPROBE_PATH: /usr/bin/ffprobe
      TASKS_FFMPEG_PATH: /usr/bin/ffmpeg
      TASKS_ARTIFACT_STORE: ${TASKS_ARTIFACT_STORE-s3}
      TASKS_OBJECT_STORE_ENDPOINT: ${TASKS_OBJECT_STORE_ENDPOINT-${TASKS_S3_ENDPOINT-http://minio:9000}}
      TASKS_OBJECT_STORE_PUBLIC_ENDPOINT: ${TASKS_OBJECT_STORE_PUBLIC_ENDPOINT-}
      TASKS_OBJECT_STORE_BUCKET: ${TASKS_OBJECT_STORE_BUCKET-${TASKS_S3_BUCKET-primer-tasks}}
      TASKS_OBJECT_STORE_ACCESS_KEY: ${TASKS_OBJECT_STORE_ACCESS_KEY-${TASKS_S3_ACCESS_KEY-minioadmin}}
      TASKS_OBJECT_STORE_SECRET_KEY: ${TASKS_OBJECT_STORE_SECRET_KEY-${TASKS_S3_SECRET_KEY-minioadmin-change-me}}
      TASKS_OBJECT_STORE_REGION: ${TASKS_OBJECT_STORE_REGION-us-east-1}
      TASKS_OBJECT_STORE_USE_PATH_STYLE: ${TASKS_OBJECT_STORE_USE_PATH_STYLE-true}
      TASKS_S3_ENDPOINT: ${TASKS_S3_ENDPOINT-http://minio:9000}
      TASKS_S3_PUBLIC_ENDPOINT: ${TASKS_S3_PUBLIC_ENDPOINT-http://object-store.${STACKLANE_INSTANCE:-dev}.primer-tasks.${STACKLANE_BASE_DOMAIN:-test}:9000}
      TASKS_S3_BUCKET: ${TASKS_S3_BUCKET-primer-tasks}
      TASKS_S3_ACCESS_KEY: ${TASKS_S3_ACCESS_KEY-minioadmin}
      TASKS_S3_SECRET_KEY: ${TASKS_S3_SECRET_KEY-minioadmin-change-me}
      TASKS_S3_CREATE_BUCKET: ${TASKS_S3_CREATE_BUCKET-true}
    volumes:
      - .:/src
      - tasks_go_mod_cache:/go/pkg/mod
      - tasks_go_build_cache:/root/.cache/go-build
      - tasks_state:/var/lib/primer-tasks
      - tasks_air_build:/tmp/primer-tasks-build
    ports:
      - "127.0.0.1::8080"
    labels:
      stacklane.enable: "true"
      stacklane.project: "primer-tasks"
      stacklane.instance: "${STACKLANE_INSTANCE:-dev}"
      stacklane.endpoint: "api"
      stacklane.port: "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      test-issuer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  external-verifier-fixture:
    build:
      context: ./external-verifier-fixture
      dockerfile: Dockerfile
    environment:
      FIXTURE_HOST: "0.0.0.0"
      FIXTURE_PORT: "8092"
      FIXTURE_SHARED_SECRET: ${TASKS_EXTERNAL_VERIFIER_SECRET-fixture-development-secret}
      # The callback base is an operator-owned service address; requests carry
      # only the production callbackPath and can never choose a URL or header.
      FIXTURE_CALLBACK_BASE_URL: ${TASKS_EXTERNAL_VERIFIER_CALLBACK_BASE_URL-http://api:8080}
      FIXTURE_EGRESS_MODE: ${TASKS_EXTERNAL_VERIFIER_EGRESS_MODE-test}
      FIXTURE_LEDGER_PATH: /var/lib/external-verifier/ledger.json
    volumes:
      - tasks_external_verifier_data:/var/lib/external-verifier
    ports:
      - "127.0.0.1::8092"
    labels:
      stacklane.enable: "true"
      stacklane.project: "primer-tasks"
      stacklane.instance: "${STACKLANE_INSTANCE:-dev}"
      stacklane.endpoint: "external-verifier"
      stacklane.port: "8092"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    working_dir: /src/web
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      DEV_API_PROXY_TARGET: http://api:8080
      DEV_SERVER_HOST: "0.0.0.0"
      DEV_SERVER_PORT: "5173"
      # Empty HMR_HOST lets Vite use the browser's same-origin host for direct
      # loopback. Set HMR_HOST to the Stacklane web FQDN when entering through
      # a VIP whose websocket endpoint is not the browser's default host.
      HMR_HOST: ${HMR_HOST-}
      HMR_CLIENT_PORT: ${HMR_CLIENT_PORT-80}
      HMR_PROTOCOL: ${HMR_PROTOCOL-ws}
      DEV_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS-.${STACKLANE_BASE_DOMAIN:-test},localhost,127.0.0.1}
    volumes:
      # System C is consumed from the live repository tree so token changes
      # and web source changes are observable without rebuilding the image.
      - .:/src
      - ../design-system:/design-system:ro
      - tasks_web_node_modules:/src/web/node_modules
      - tasks_npm_cache:/root/.npm
    ports:
      - "127.0.0.1::5173"
    labels:
      stacklane.enable: "true"
      stacklane.project: "primer-tasks"
      stacklane.instance: "${STACKLANE_INSTANCE:-dev}"
      stacklane.endpoint: "web"
      stacklane.port: "${STACKLANE_WEB_PUBLIC_PORT:-5173}"
      stacklane.target_port: "5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  tasks_postgres_data:
  tasks_issuer_postgres_data:
  tasks_go_mod_cache:
  tasks_go_build_cache:
  tasks_state:
  tasks_object_data:
  tasks_air_build:
  tasks_web_node_modules:
  tasks_npm_cache:
  tasks_external_verifier_data:
