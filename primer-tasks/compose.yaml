# Primer Tasks development stack.
#
# Host publishes are deliberately loopback + ephemeral. Stacklane maps the
# assigned loopback ports to its durable VIP; direct loopback URLs remain a
# useful fallback when Stacklane is unavailable.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: primer_tasks
      POSTGRES_USER: tasks
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - tasks_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d primer_tasks"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  issuer-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: primer_tasks_issuer
      POSTGRES_USER: tasks_issuer
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - tasks_issuer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks_issuer -d primer_tasks_issuer"]
      interval: 5s
      timeout: 3s
      retries: 12

  test-issuer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /src
    entrypoint: [""]
    command: ["go", "run", "./cmd/tasks-test-issuer"]
    environment:
      TASKS_TEST_ISSUER_HOST: "0.0.0.0"
      TASKS_TEST_ISSUER_PORT: "8091"
      TASKS_TEST_ISSUER_URL: ${TASKS_PUBLIC_ISSUER_URL-http://test-issuer.${STACKLANE_INSTANCE:-dev}.primer-tasks.${STACKLANE_BASE_DOMAIN:-test}}
      TASKS_TEST_PRINCIPAL: ${TASKS_TEST_PRINCIPAL-parent-a}
      TASKS_TEST_ISSUER_DATABASE_URL: postgres://tasks_issuer@issuer-postgres:5432/primer_tasks_issuer?sslmode=disable
    volumes:
      - .:/src
      - tasks_go_mod_cache:/go/pkg/mod
      - tasks_go_build_cache:/root/.cache/go-build
    depends_on:
      issuer-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1::8091"
    labels:
      stacklane.enable: "true"
      stacklane.project: "primer-tasks"
      stacklane.instance: "${STACKLANE_INSTANCE:-dev}"
      stacklane.endpoint: "test-issuer"
      stacklane.port: "8091"
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /src
    entrypoint: [""]
    command: ["go", "run", "./cmd/tasks-migrate", "up"]
    environment:
      TASKS_DATABASE_URL: postgres://tasks@postgres:5432/primer_tasks?sslmode=disable
      TASKS_ENV: ${TASKS_ENV-development}
    volumes:
      - .:/src
      - tasks_go_mod_cache:/go/pkg/mod
      - tasks_go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /src
    command: ["air", "-c", ".air.toml"]
    environment:
      TASKS_HOST: "0.0.0.0"
      TASKS_PORT: "8080"
      TASKS_ENV: ${TASKS_ENV-development}
      # Development defaults to the narrow local test-auth seam. Production
      # must supply TASKS_AUTH_MODE=oidc and a real Primer Identity issuer;
      # the server verifies ID tokens via discovery/JWKS (ES256) and exits
      # before listening when production is misconfigured.
      TASKS_AUTH_MODE: ${TASKS_AUTH_MODE-test}
      # Back-channel token exchange uses Compose DNS. Browser authorization
      # is rewritten to the request host's /issuer proxy at login time.
      TASKS_ISSUER_URL: ${TASKS_ISSUER_URL-http://test-issuer:8091}
      TASKS_PUBLIC_ISSUER_URL: ${TASKS_PUBLIC_ISSUER_URL-http://test-issuer:8091}
      TASKS_OIDC_CLIENT_ID: ${TASKS_OIDC_CLIENT_ID-primer-tasks-web}
      TASKS_OIDC_REDIRECT_URL: ${TASKS_OIDC_REDIRECT_URL-http://127.0.0.1/auth/callback}
      TASKS_TEST_PRINCIPAL: ${TASKS_TEST_PRINCIPAL-parent-a}
      TASKS_TEST_ISSUER_SECRET: ${TASKS_TEST_ISSUER_SECRET-primer-tasks-test-issuer-secret}
      TASKS_DATABASE_URL: postgres://tasks@postgres:5432/primer_tasks?sslmode=disable
      TASKS_PUBLIC_ORIGIN: ${TASKS_PUBLIC_ORIGIN-http://web.${STACKLANE_INSTANCE:-dev}.primer-tasks.${STACKLANE_BASE_DOMAIN:-test}}
      TASKS_ALLOWED_ORIGINS: ${TASKS_ALLOWED_ORIGINS-http://web.${STACKLANE_INSTANCE:-dev}.primer-tasks.${STACKLANE_BASE_DOMAIN:-test},http://127.0.0.1}
      TASKS_ARTIFACT_STORE_DIR: /var/lib/primer-tasks/artifacts
    volumes:
      - .:/src
      - tasks_go_mod_cache:/go/pkg/mod
      - tasks_go_build_cache:/root/.cache/go-build
      - tasks_state:/var/lib/primer-tasks
      - tasks_air_build:/tmp/primer-tasks-build
    ports:
      - "127.0.0.1::8080"
    labels:
      stacklane.enable: "true"
      stacklane.project: "primer-tasks"
      stacklane.instance: "${STACKLANE_INSTANCE:-dev}"
      stacklane.endpoint: "api"
      stacklane.port: "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      test-issuer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    working_dir: /src/web
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      DEV_API_PROXY_TARGET: http://api:8080
      DEV_SERVER_HOST: "0.0.0.0"
      DEV_SERVER_PORT: "5173"
      # Empty HMR_HOST lets Vite use the browser's same-origin host for direct
      # loopback. Set HMR_HOST to the Stacklane web FQDN when entering through
      # a VIP whose websocket endpoint is not the browser's default host.
      HMR_HOST: ${HMR_HOST-}
      HMR_CLIENT_PORT: ${HMR_CLIENT_PORT-80}
      HMR_PROTOCOL: ${HMR_PROTOCOL-ws}
      DEV_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS-.${STACKLANE_BASE_DOMAIN:-test},localhost,127.0.0.1}
    volumes:
      # System C is consumed from the live repository tree so token changes
      # and web source changes are observable without rebuilding the image.
      - .:/src
      - ../design-system:/design-system:ro
      - tasks_web_node_modules:/src/web/node_modules
      - tasks_npm_cache:/root/.npm
    ports:
      - "127.0.0.1::5173"
    labels:
      stacklane.enable: "true"
      stacklane.project: "primer-tasks"
      stacklane.instance: "${STACKLANE_INSTANCE:-dev}"
      stacklane.endpoint: "web"
      stacklane.port: "80"
      stacklane.target_port: "5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  tasks_postgres_data:
  tasks_issuer_postgres_data:
  tasks_go_mod_cache:
  tasks_go_build_cache:
  tasks_state:
  tasks_air_build:
  tasks_web_node_modules:
  tasks_npm_cache:
