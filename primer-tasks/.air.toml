root = "/src"
tmp_dir = "/tmp/primer-tasks-build"

[build]
  bin = "/tmp/primer-tasks-build/tasks-server"
  cmd = "go build -trimpath -o /tmp/primer-tasks-build/tasks-server ./cmd/tasks-server"
  delay = 1000
  exclude_dir = [".git", "web", "android", "clients", "test-artifacts", "tmp"]
  exclude_file = [".*\\.test\\.go"]
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  follow_symlink = false
  include_ext = ["go", "sql", "yaml", "yml"]
  kill_delay = "500ms"
  log = "/tmp/primer-tasks-build/build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = "green"
  build = "yellow"
  main = "magenta"
  runner = "cyan"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
