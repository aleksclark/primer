components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/HealthOutBody.json
          format: uri
          readOnly: true
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    ReadyOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/ReadyOutBody.json
          format: uri
          readOnly: true
          type: string
        status:
          examples:
            - ready
          type: string
      required:
        - status
      type: object
    StartOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - //schemas/StartOutBody.json
          format: uri
          readOnly: true
          type: string
        status:
          examples:
            - started
          type: string
      required:
        - status
      type: object
info:
  description: "Primer Identity service: health, readiness, and (later) OIDC/OAuth."
  title: Primer Identity API
  version: 0.1.0
openapi: 3.1.0
paths:
  /.well-known/jwks.json:
    get:
      operationId: jwks
      responses:
        "200":
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: JSON Web Key Set
      tags:
        - OAuth
  /.well-known/oauth-authorization-server:
    get:
      operationId: oauthAuthorizationServer
      responses:
        "200":
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: OAuth authorization server metadata
      tags:
        - OAuth
  /broker/stytch/callback:
    get:
      operationId: brokerCallback
      parameters:
        - description: Single-use callback artifact
          explode: false
          in: query
          name: token
          schema:
            description: Single-use callback artifact
            type: string
            writeOnly: true
        - description: Single-use SSO callback artifact
          explode: false
          in: query
          name: sso_token
          schema:
            description: Single-use SSO callback artifact
            type: string
            writeOnly: true
        - explode: false
          in: query
          name: type
          schema:
            type: string
      responses:
        "303":
          description: See Other
          headers:
            Cache-Control:
              schema:
                type: string
            Location:
              schema:
                type: string
            Pragma:
              schema:
                type: string
            Referrer-Policy:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
            Strict-Transport-Security:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Complete a broker callback
      tags:
        - Broker
  /broker/stytch/email/start:
    post:
      operationId: brokerEmailStart
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartOutBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            Location:
              schema:
                type: string
            Pragma:
              schema:
                type: string
            Referrer-Policy:
              schema:
                type: string
            Strict-Transport-Security:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
        "303":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: See Other
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Start a broker authentication method
      tags:
        - Broker
  /broker/stytch/email/verify:
    post:
      operationId: brokerEmailVerify
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartOutBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            Location:
              schema:
                type: string
            Pragma:
              schema:
                type: string
            Referrer-Policy:
              schema:
                type: string
            Strict-Transport-Security:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
        "303":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: See Other
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Start a broker authentication method
      tags:
        - Broker
  /broker/stytch/login:
    get:
      operationId: brokerLogin
      parameters:
        - in: header
          name: Accept
          schema:
            type: string
        - in: cookie
          name: __Host-primer-broker
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Broker login discovery
      tags:
        - Broker
  /broker/stytch/sso/start:
    post:
      operationId: brokerSSOStart
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartOutBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            Location:
              schema:
                type: string
            Pragma:
              schema:
                type: string
            Referrer-Policy:
              schema:
                type: string
            Strict-Transport-Security:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
        "303":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: See Other
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Start a broker authentication method
      tags:
        - Broker
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - System
  /oauth/authorize:
    get:
      operationId: oauthAuthorize
      responses:
        "303":
          description: See Other
          headers:
            Cache-Control:
              schema:
                type: string
            Location:
              schema:
                type: string
            Pragma:
              schema:
                type: string
            Referrer-Policy:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
            Strict-Transport-Security:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Start an OAuth authorization request
      tags:
        - Broker
  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyOutBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Readiness probe (database ping)
      tags:
        - System
servers:
  - url: /
