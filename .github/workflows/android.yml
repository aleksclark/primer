name: android

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "design-system/**"
      - "primer-tasks/clients/kotlin/**"
      - "primer-tasks/internal/api/**"
      - "primer-tasks/cmd/openapi-gen/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "design-system/**"
      - "primer-tasks/clients/kotlin/**"
      - "primer-tasks/internal/api/**"
      - "primer-tasks/cmd/openapi-gen/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 requires JDK 17; the runner's default JDK is newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate shared design tokens
        working-directory: .
        run: make design-system

      - name: Generate Tasks Kotlin client
        working-directory: .
        run: |
          make -C primer-tasks openapi
          node primer-tasks/clients/kotlin/generate-client.mjs

      - name: Unit tests
        run: ./gradlew test --no-daemon --max-workers=1

      - name: Student release lint
        run: ./gradlew :app-student:lintRelease --no-daemon --max-workers=1

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: primer-tv-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Student debug APK (not managed-release qualification)
        uses: actions/upload-artifact@v4
        with:
          name: primer-student-debug
          path: android/app-student/build/outputs/apk/debug/app-student-debug.apk
          if-no-files-found: error
