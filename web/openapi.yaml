info:
  description: "LMS backend for the Primer AI tutoring system: students, curricula, standards, mastery tracking, and assessments."
  title: Primer LMS API
  version: 0.1.0
openapi: 3.1.0
paths:
  /assessment-attempts:
    get:
      description: List assessment-attempts with pagination, search (), sorting (status, score, started_at, submitted_at, created_at, updated_at), and filters (assessment_id, student_id, status).
      operationId: list-assessment-attempts
      parameters:
        - description: Page size.
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size.
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: Rows to skip.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Rows to skip.
            format: int64
            minimum: 0
            type: integer
        - description: Free-text search across the resource's searchable columns.
          explode: false
          in: query
          name: q
          schema:
            description: Free-text search across the resource's searchable columns.
            type: string
        - description: Column to sort by (whitelisted per resource).
          explode: false
          in: query
          name: sort
          schema:
            description: Column to sort by (whitelisted per resource).
            type: string
        - description: Sort direction.
          explode: false
          in: query
          name: dir
          schema:
            default: asc
            description: Sort direction.
            enum:
              - asc
