  /subjects:
    get:
      description: List subjects with pagination, search (code, name, description), sorting (code, name, created_at, updated_at), and filters (code).
      operationId: list-subjects
      parameters:
        - description: Page size.
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size.
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: Rows to skip.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Rows to skip.
            format: int64
            minimum: 0
            type: integer
        - description: Free-text search across the resource's searchable columns.
          explode: false
          in: query
          name: q
          schema:
            description: Free-text search across the resource's searchable columns.
            type: string
        - description: Column to sort by (whitelisted per resource).
          explode: false
          in: query
          name: sort
          schema:
            description: Column to sort by (whitelisted per resource).
            type: string
        - description: Sort direction.
          explode: false
          in: query
          name: dir
          schema:
            default: asc
            description: Sort direction.
            enum:
              - asc
              - desc
            type: string
        - description: Exact-match filters as column:value pairs, e.g. filter=status:active. Repeatable.
          explode: true
          in: query
          name: filter
          schema:
            description: Exact-match filters as column:value pairs, e.g. filter=status:active. Repeatable.
            items:
              type: string
            type:
              - array
              - "null"
