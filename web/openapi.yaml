        gradeLevel:
          format: int64
          type: integer
        id:
          format: uuid
          type: string
        kind:
          enum:
            - continuous
            - quick_check
            - comprehensive
            - tcap_practice
            - quiz
            - project_rubric
          type: string
        metadata:
