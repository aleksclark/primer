        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/InstructionLogIngest.json
          format: uri
          readOnly: true
          type: string
        class:
          description: Only educational and mixed viewing is instructional time; entertainment is refused.
          enum:
            - educational
            - mixed
          type: string
        mediaTitle:
          minLength: 1
          type: string
        notes:
          type: string
        occurredOn:
          description: Calendar day the viewing happened, YYYY-MM-DD, in the producer's own timezone.
          examples:
            - "2031-04-15"
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
        source:
          default: tv
          description: Producing service.
          enum:
            - tv
            - manual
          type: string
        sourceRef:
          description: The producer's stable identifier for this event — the TV server sends its playback session ID. Re-posting the same reference returns the log already recorded instead of counting the time twice.
          minLength: 1
          type: string
        standardCodes:
          items:
            type: string
          type:
            - array
            - "null"
        studentId:
          format: uuid
          type: string
        subjectTags:
          items:
            type: string
          type:
            - array
            - "null"
        watchedSeconds:
          format: int64
          minimum: 1
          type: integer
      required:
        - sourceRef
        - mediaTitle
        - class
        - watchedSeconds
        - occurredOn
      type: object
