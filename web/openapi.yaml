info:
  description: "LMS backend for the Primer AI tutoring system: students, curricula, standards, mastery tracking, and assessments."
  title: Primer LMS API
  version: 0.1.0
openapi: 3.1.0
paths:
  /agent/runs:
    post:
      description: Starts a bounded, non-durable MAF run. The returned ID may be streamed, inspected, or cancelled by the authenticated parent.
      operationId: start-agent-run
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAgentRunInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSnapshot"
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - parentSession: []
      summary: Start a process-local agent run
      tags:
        - Agent Runtime
  /agent/runs/{id}:
    get:
      operationId: get-agent-run
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSnapshot"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - parentSession: []
      summary: Get agent run status
      tags:
        - Agent Runtime
  /agent/runs/{id}/cancel:
    post:
      operationId: cancel-agent-run
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSnapshot"
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - parentSession: []
      summary: Cancel an agent run
      tags:
        - Agent Runtime
  /agent/runs/{id}/events:
    get:
      description: Streams Primer SSE events. Disconnecting this subscriber does not cancel the process-local run.
      operationId: stream-agent-run
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "200":
          content:
            text/event-stream: {}
