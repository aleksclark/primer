components:
  schemas:
    ActivityContent:
      additionalProperties: false
      properties:
        artifacts:
          $ref: "#/components/schemas/ArtifactPolicy"
        checks:
          items:
            $ref: "#/components/schemas/Check"
          type:
            - array
            - "null"
        hints:
          items:
            $ref: "#/components/schemas/Hint"
          type:
            - array
            - "null"
        instructions:
          type: string
        objective:
          type: string
        progression:
          $ref: "#/components/schemas/ProgressionPolicy"
        tasks:
          items:
            $ref: "#/components/schemas/Task"
          type:
            - array
            - "null"
        terminal:
          $ref: "#/components/schemas/TerminalContent"
        tutor:
          $ref: "#/components/schemas/TutorContext"
        typing:
          $ref: "#/components/schemas/TypingContent"
      required:
        - objective
        - instructions
        - tasks
        - checks
      type: object
    ArtifactMeta:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ArtifactMeta.json
          format: uri
          readOnly: true
          type: string
        artifactId:
          type: string
        byteSize:
          format: int64
          type: integer
        createdAt:
          format: date-time
          type: string
        filename:
          type: string
        mediaType:
          type: string
        schemaVersion:
          type: string
        sha256:
          type: string
      required:
        - schemaVersion
        - artifactId
        - filename
        - mediaType
        - byteSize
        - sha256
        - createdAt
      type: object
    ArtifactPolicy:
      additionalProperties: false
      properties:
        allowedTypes:
          items:
            type: string
          type:
            - array
            - "null"
        enabled:
          type: boolean
        maxBytesEach:
          format: int64
          type: integer
        maxBytesTotal:
          format: int64
          type: integer
        maxFiles:
          format: int64
          type: integer
        retainDays:
          format: int64
          type: integer
      required:
        - enabled
      type: object
