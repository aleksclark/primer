components:
  schemas:
    AppRelease:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AppRelease.json
          format: uri
          readOnly: true
          type: string
        available:
          description: Whether a release is published at all.
          type: boolean
        downloadUrl:
          description: Path to fetch the APK from.
          type: string
        sha256:
          description: Hex digest of the APK, for verifying the download.
          type: string
        sizeBytes:
          description: Size of the APK, so the client can show progress.
          format: int64
          type: integer
        versionCode:
          description: Android versionCode of the published APK. Higher means newer.
          format: int64
          type: integer
      required:
        - available
        - versionCode
        - sizeBytes
        - sha256
        - downloadUrl
      type: object
    AvailabilityWindow:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AvailabilityWindow.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        endsAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        maxPlays:
          format: int64
          type: integer
        mediaItemId:
          format: uuid
          type: string
        note:
          type: string
        startsAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - mediaItemId
        - startsAt
        - endsAt
        - note
        - createdAt
        - updatedAt
      type: object
    AvailabilityWindowCreate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AvailabilityWindowCreate.json
          format: uri
          readOnly: true
          type: string
        endsAt:
          format: date-time
          type: string
        mediaItemId:
          format: uuid
          type: string
        note:
          type: string
        startsAt:
          format: date-time
          type: string
      required:
        - mediaItemId
        - endsAt
      type: object
    AvailabilityWindowUpdate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AvailabilityWindowUpdate.json
          format: uri
          readOnly: true
          type: string
        endsAt:
          format: date-time
          type: string
        note:
          type: string
        startsAt:
          format: date-time
          type: string
      type: object
    BrowseItem:
      additionalProperties: false
      properties:
        audioCodec:
          type: string
        container:
          type: string
        imageTag:
          type: string
        imported:
          description: Whether this item already exists as a media item.
          type: boolean
        jellyfinItemId:
          type: string
        overview:
          type: string
        runtimeSeconds:
          format: int64
          type: integer
        sortTitle:
          type: string
        title:
          type: string
        type:
          type: string
        videoCodec:
          type: string
      required:
        - jellyfinItemId
        - title
        - sortTitle
        - overview
        - type
        - runtimeSeconds
        - container
        - videoCodec
        - audioCodec
        - imageTag
        - imported
      type: object
    BrowseResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/BrowseResponse.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/BrowseItem"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    CatalogItem:
      additionalProperties: false
      properties:
        availabilityWindowId:
          format: uuid
          type: string
        imageUrl:
          description: TV-server-proxied artwork URL.
          type: string
        mediaItem:
          $ref: "#/components/schemas/MediaItem"
        windowEndsAt:
          format: date-time
          type: string
      required:
        - mediaItem
        - availabilityWindowId
        - windowEndsAt
        - imageUrl
      type: object
    CatalogResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CatalogResponse.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/CatalogItem"
          type:
            - array
            - "null"
        serverTime:
          description: Server clock; clients trust this over their own.
          format: date-time
          type: string
      required:
        - items
        - serverTime
      type: object
    CompleteRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CompleteRequest.json
          format: uri
          readOnly: true
          type: string
        completed:
          description: Whether playback reached the end. Defaults to true.
          type: boolean
        positionSeconds:
          format: int64
          minimum: 0
          type: integer
        watchedSeconds:
          format: int64
          minimum: 0
          type: integer
      required:
        - positionSeconds
      type: object
    CompletionStats:
      additionalProperties: false
      properties:
        completed:
          format: int64
          type: integer
        sessions:
          format: int64
          type: integer
        watchedSeconds:
          format: int64
          type: integer
      required:
        - sessions
        - completed
        - watchedSeconds
      type: object
    CopyWeekRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CopyWeekRequest.json
          format: uri
          readOnly: true
          type: string
        fromWeekStart:
          description: First day of the source week, YYYY-MM-DD in the channel timezone.
          type: string
        replace:
          description: Delete the destination week's existing entries first. Defaults to false, which keeps them and skips whatever would collide.
          type: boolean
        toWeekStart:
          description: First day of the destination week, YYYY-MM-DD in the channel timezone.
          type: string
      required:
        - fromWeekStart
        - toWeekStart
      type: object
    CopyWeekResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CopyWeekResponse.json
          format: uri
          readOnly: true
          type: string
        copied:
          format: int64
          type: integer
        deleted:
          description: Destination entries removed because replace was set.
          format: int64
          type: integer
        skipped:
          description: Airings that could not be placed, with the reason.
          items:
            $ref: "#/components/schemas/SkippedEntry"
          type:
            - array
            - "null"
      required:
        - copied
        - deleted
        - skipped
      type: object
    Device:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/Device.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
            - tablet
            - tv_box
          type: string
        lastSeenAt:
          format: date-time
          type: string
        name:
          type: string
        pairedAt:
          format: date-time
          type: string
        pairingCode:
          type: string
        pairingExpiresAt:
          format: date-time
          type: string
        revokedAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - kind
        - pairingCode
        - createdAt
        - updatedAt
      type: object
    DeviceCreate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/DeviceCreate.json
          format: uri
          readOnly: true
          type: string
        kind:
          enum:
            - tablet
            - tv_box
          type: string
        name:
          minLength: 1
          type: string
      required:
        - name
      type: object
    DeviceUpdate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/DeviceUpdate.json
          format: uri
          readOnly: true
          type: string
        kind:
          enum:
            - tablet
            - tv_box
          type: string
        name:
          type: string
        revokedAt:
          format: date-time
          type: string
      type: object
    EntertainmentUsage:
      additionalProperties: false
      properties:
        playsUsed:
          format: int64
          type: integer
        windowsOffered:
          format: int64
          type: integer
      required:
        - windowsOffered
        - playsUsed
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GrantResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/GrantResponse.json
          format: uri
          readOnly: true
          type: string
        expiresAt:
          format: date-time
          type: string
        grantId:
          format: uuid
          type: string
        mode:
          enum:
            - on_demand
            - programmed
          type: string
        serverTime:
          format: date-time
          type: string
        startOffsetSeconds:
          format: int64
          type: integer
        streamUrl:
          type: string
      required:
        - grantId
        - streamUrl
        - startOffsetSeconds
        - mode
        - expiresAt
        - serverTime
      type: object
    GridResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/GridResponse.json
          format: uri
          readOnly: true
          type: string
        days:
          format: int64
          type: integer
        endsAt:
          format: date-time
          type: string
        programmes:
          description: Airings overlapping the span, earliest first.
          items:
            $ref: "#/components/schemas/Programme"
          type:
            - array
            - "null"
        serverTime:
          format: date-time
          type: string
        startsAt:
          format: date-time
          type: string
        timezone:
          description: IANA zone the span's day boundaries were computed in.
          type: string
      required:
        - timezone
        - startsAt
        - endsAt
        - days
        - programmes
        - serverTime
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    HeartbeatRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/HeartbeatRequest.json
          format: uri
          readOnly: true
          type: string
        positionSeconds:
          description: Current playhead position.
          format: int64
          minimum: 0
          type: integer
        watchedSeconds:
          description: Seconds actually watched; defaults to the position.
          format: int64
          minimum: 0
          type: integer
      required:
        - positionSeconds
      type: object
    MediaItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/MediaItem.json
          format: uri
          readOnly: true
          type: string
        audioCodec:
          type: string
        class:
          enum:
            - educational
            - entertainment
            - mixed
          type: string
        container:
          type: string
        createdAt:
          format: date-time
          type: string
        directPlayOk:
          type: boolean
        id:
          format: uuid
          type: string
        imageTag:
          type: string
        jellyfinItemId:
          type: string
        orphanedAt:
          format: date-time
          type: string
        overview:
          type: string
        qualityNotes:
          type: string
        runtimeSeconds:
          format: int64
          type: integer
        sortTitle:
          type: string
        standardCodes:
          items:
            type: string
          type:
            - array
            - "null"
        subjectTags:
          items:
            type: string
          type:
            - array
            - "null"
        title:
          type: string
        updatedAt:
          format: date-time
          type: string
        videoCodec:
          type: string
      required:
        - id
        - jellyfinItemId
        - title
        - sortTitle
        - overview
        - class
        - runtimeSeconds
        - subjectTags
        - standardCodes
        - qualityNotes
        - container
        - videoCodec
        - audioCodec
        - directPlayOk
        - imageTag
        - createdAt
        - updatedAt
      type: object
    MediaItemCreate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/MediaItemCreate.json
          format: uri
          readOnly: true
          type: string
        audioCodec:
          type: string
        class:
          enum:
            - educational
            - entertainment
            - mixed
          type: string
        container:
          type: string
        directPlayOk:
          type: boolean
        imageTag:
          type: string
        jellyfinItemId:
          minLength: 1
          type: string
        overview:
          type: string
        qualityNotes:
          type: string
        runtimeSeconds:
          format: int64
          minimum: 0
          type: integer
        sortTitle:
          type: string
        standardCodes:
          items:
            type: string
          type: array
        subjectTags:
          items:
            type: string
          type: array
        title:
          minLength: 1
          type: string
        videoCodec:
          type: string
      required:
        - jellyfinItemId
        - title
        - class
      type: object
    MediaItemUpdate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/MediaItemUpdate.json
          format: uri
          readOnly: true
          type: string
        audioCodec:
          type: string
        class:
          enum:
            - educational
            - entertainment
            - mixed
          type: string
        container:
          type: string
        directPlayOk:
          type: boolean
        imageTag:
          type: string
        orphanedAt:
          format: date-time
          type: string
        overview:
          type: string
        qualityNotes:
          type: string
        runtimeSeconds:
          format: int64
          minimum: 0
          type: integer
        sortTitle:
          type: string
        standardCodes:
          items:
            type: string
          type: array
        subjectTags:
          items:
            type: string
          type: array
        title:
          type: string
        videoCodec:
          type: string
      type: object
    MetricsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/MetricsResponse.json
          format: uri
          readOnly: true
          type: string
        byClass:
          items:
            $ref: "#/components/schemas/WatchTimeByClass"
          type:
            - array
            - "null"
        byDay:
          items:
            $ref: "#/components/schemas/WatchTimeByDay"
          type:
            - array
            - "null"
        bySubject:
          description: A viewing counts once per subject tag its item carries, so these may sum to more than the total.
          items:
            $ref: "#/components/schemas/WatchTimeBySubject"
          type:
            - array
            - "null"
        completion:
          $ref: "#/components/schemas/CompletionStats"
        entertainment:
          $ref: "#/components/schemas/EntertainmentUsage"
        from:
          description: Start of the reporting window.
          format: date-time
          type: string
        timezone:
          description: IANA zone the daily buckets use.
          type: string
        to:
          description: End of the reporting window, exclusive.
          format: date-time
          type: string
      required:
        - from
        - to
        - timezone
        - byClass
        - bySubject
        - byDay
        - completion
        - entertainment
      type: object
    NowResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/NowResponse.json
          format: uri
          readOnly: true
          type: string
        next:
          $ref: "#/components/schemas/Programme"
          description: The next programme to start, absent when nothing further is scheduled.
        nextStartsInSeconds:
          description: Seconds until next starts.
          format: int64
          type: integer
        offsetSeconds:
          description: Seconds elapsed since onAir started, per the server clock.
          format: int64
          type: integer
        onAir:
          $ref: "#/components/schemas/Programme"
          description: The programme airing right now, absent when the channel is in a gap.
        serverTime:
          description: Server clock; clients trust this over their own.
          format: date-time
          type: string
        startOffsetSeconds:
          description: Position a device tuning in now must start from. Zero when the entry forbids joining in progress.
          format: int64
          type: integer
      required:
        - offsetSeconds
        - startOffsetSeconds
        - nextStartsInSeconds
        - serverTime
      type: object
    PageBodyAvailabilityWindow:
      additionalProperties: false
