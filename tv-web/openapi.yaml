        watchedSeconds:
          format: int64
          type: integer
      required:
        - id
        - grantId
        - mediaItemId
        - deviceId
        - startedAt
        - watchedSeconds
        - maxPositionSeconds
        - completed
        - createdAt
        - updatedAt
      type: object
    PrimerReport:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/PrimerReport.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        playbackSessionId:
          format: uuid
          type: string
        primerRef:
          type: string
        reportedAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - playbackSessionId
        - reportedAt
        - primerRef
        - createdAt
        - updatedAt
      type: object
    PrimerRunResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/PrimerRunResponse.json
          format: uri
          readOnly: true
          type: string
        duplicate:
          description: Viewings the LMS already held under the same reference.
          format: int64
          type: integer
        failed:
          description: Viewings that could not be reported and stay queued for the next pass.
          format: int64
          type: integer
        reported:
          description: Viewings the LMS recorded as new instructional time.
          format: int64
          type: integer
        scanned:
          description: Unreported viewings the pass picked up.
          format: int64
          type: integer
      required:
        - scanned
        - reported
        - duplicate
        - failed
      type: object
    Programme:
      additionalProperties: false
      properties:
        airsAt:
          format: date-time
          type: string
        block:
          enum:
            - morning
            - midday
            - afternoon
            - evening
          type: string
        class:
          enum:
            - educational
            - entertainment
            - mixed
          type: string
        directPlayOk:
          type: boolean
        endsAt:
          description: airsAt plus the item's runtime; the slot is half-open.
          format: date-time
          type: string
        imageUrl:
          description: TV-server-proxied artwork URL.
          type: string
        joinInProgress:
          description: Whether a device tuning in late joins at the broadcast offset instead of the start.
          type: boolean
        mediaItemId:
          format: uuid
          type: string
        overview:
          type: string
        runtimeSeconds:
          format: int64
          type: integer
        scheduleEntryId:
          format: uuid
          type: string
        subjectTags:
          items:
            type: string
          type:
            - array
            - "null"
        title:
          type: string
      required:
        - scheduleEntryId
        - mediaItemId
        - title
        - overview
        - class
        - subjectTags
        - runtimeSeconds
        - airsAt
        - endsAt
        - block
        - joinInProgress
        - directPlayOk
        - imageUrl
      type: object
    RotateRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/RotateRequest.json
          format: uri
          readOnly: true
          type: string
        days:
          description: How long the new windows stay open. Defaults to 7.
          format: int64
          maximum: 90
          minimum: 1
          type: integer
        expireOpen:
          description: Close everything currently on offer first, so the catalog turns over rather than growing.
          type: boolean
        limit:
          description: How many suggestions to take when no items are named. Defaults to 8.
          format: int64
          maximum: 50
          minimum: 1
          type: integer
        mediaItemIds:
          description: Items to offer. Empty takes the server's own suggestions.
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    RotateResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/RotateResponse.json
          format: uri
          readOnly: true
          type: string
        expired:
          description: Windows closed.
          format: int64
          type: integer
        opened:
          description: Windows opened. Items that already had one open are skipped.
          items:
            $ref: "#/components/schemas/AvailabilityWindow"
          type:
            - array
            - "null"
      required:
        - expired
        - opened
      type: object
    RotationSuggestion:
      additionalProperties: false
      properties:
        lastWindowEndedAt:
          description: When this item was last on offer. The Unix epoch means it never has been.
          format: date-time
          type: string
        mediaItem:
          $ref: "#/components/schemas/MediaItem"
      required:
        - mediaItem
        - lastWindowEndedAt
      type: object
    ScheduleEntry:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ScheduleEntry.json
          format: uri
          readOnly: true
          type: string
        airsAt:
          format: date-time
          type: string
        block:
          enum:
            - morning
            - midday
            - afternoon
            - evening
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        joinInProgress:
          type: boolean
        mediaItemId:
          format: uuid
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - mediaItemId
        - airsAt
        - joinInProgress
        - block
        - createdAt
        - updatedAt
      type: object
    ScheduleEntryCreate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ScheduleEntryCreate.json
          format: uri
          readOnly: true
          type: string
        airsAt:
          format: date-time
          type: string
        block:
          description: Day-part label. Defaults to the one matching airsAt in the channel timezone.
          enum:
            - morning
            - midday
            - afternoon
            - evening
          type: string
        joinInProgress:
          description: Whether a device tuning in late joins at the broadcast offset. Defaults to true.
          type: boolean
        mediaItemId:
          format: uuid
          type: string
      required:
        - mediaItemId
        - airsAt
      type: object
    ScheduleEntryUpdate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ScheduleEntryUpdate.json
          format: uri
          readOnly: true
          type: string
        airsAt:
          format: date-time
          type: string
        block:
          enum:
            - morning
            - midday
            - afternoon
            - evening
          type: string
        joinInProgress:
          type: boolean
        mediaItemId:
          format: uuid
          type: string
      type: object
    ScheduleResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ScheduleResponse.json
          format: uri
          readOnly: true
          type: string
        day:
          description: The calendar day rendered, in YYYY-MM-DD.
          type: string
        dayEndsAt:
          description: Midnight closing the day, as an instant.
          format: date-time
          type: string
        dayStartsAt:
          description: Midnight opening the day, as an instant.
          format: date-time
          type: string
        programmes:
          description: Airings overlapping the day, earliest first. A programme running past midnight appears on both days.
          items:
            $ref: "#/components/schemas/Programme"
          type:
            - array
            - "null"
        serverTime:
          format: date-time
          type: string
        timezone:
          description: IANA zone the day boundaries were computed in.
          type: string
      required:
        - day
        - timezone
        - dayStartsAt
        - dayEndsAt
        - programmes
        - serverTime
      type: object
    SessionResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/SessionResponse.json
          format: uri
          readOnly: true
          type: string
        playConsumed:
          description: Whether this call burned the item's availability window.
          type: boolean
        serverTime:
          format: date-time
          type: string
        session:
          $ref: "#/components/schemas/PlaybackSession"
      required:
        - session
        - playConsumed
        - serverTime
      type: object
    SkippedEntry:
      additionalProperties: false
      properties:
        airsAt:
          description: Where the entry would have landed.
          format: date-time
          type: string
        mediaItemId:
          format: uuid
          type: string
        reason:
          type: string
        title:
          type: string
      required:
        - mediaItemId
        - title
        - airsAt
        - reason
      type: object
    SuggestionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/SuggestionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        suggestions:
          items:
            $ref: "#/components/schemas/RotationSuggestion"
          type:
            - array
            - "null"
      required:
        - suggestions
      type: object
    SyncResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/SyncResponse.json
          format: uri
          readOnly: true
          type: string
        checked:
          description: Media items examined.
          format: int64
          type: integer
        orphaned:
          description: Media item IDs whose Jellyfin source has disappeared.
          items:
            type: string
          type:
            - array
            - "null"
        updated:
          description: Media items whose cached metadata changed.
          format: int64
          type: integer
      required:
        - checked
        - updated
        - orphaned
      type: object
    WatchTimeByClass:
      additionalProperties: false
      properties:
        class:
          type: string
        sessions:
          format: int64
          type: integer
        watchedSeconds:
          format: int64
          type: integer
      required:
        - class
        - sessions
        - watchedSeconds
      type: object
    WatchTimeByDay:
      additionalProperties: false
      properties:
        day:
          format: date
          type: string
        instructionalWatchedSeconds:
          format: int64
          type: integer
        sessions:
          format: int64
          type: integer
        watchedSeconds:
          format: int64
          type: integer
      required:
        - day
        - sessions
        - watchedSeconds
        - instructionalWatchedSeconds
      type: object
    WatchTimeBySubject:
      additionalProperties: false
      properties:
        sessions:
          format: int64
          type: integer
        subject:
          type: string
        watchedSeconds:
          format: int64
          type: integer
      required:
        - subject
        - sessions
        - watchedSeconds
      type: object
  securitySchemes:
    adminKey:
      description: Admin API key, presented by the admin SPA and by Primer.
      in: header
      name: X-Admin-Key
      type: apiKey
    deviceToken:
      bearerFormat: opaque
      description: Device token issued by POST /devices/pair.
      scheme: bearer
      type: http
info:
  description: "Content-access backend for the Primer virtual TV channel: catalog, availability windows, watch-once ledger, play grants, and playback sessions."
  title: Primer TV API
  version: 0.1.0
openapi: 3.1.0
paths:
  /app/release:
    get:
      description: What the client compares against its own versionCode to decide whether to update.
      operationId: get-app-release
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRelease"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - deviceToken: []
      summary: Latest published app version
      tags:
        - Device
  /app/release/apk:
    get:
      description: The published APK, for sideloading onto a device with no app store.
      operationId: download-app-apk
      responses:
        "200":
          content:
            application/json:
              schema:
                contentEncoding: base64
                type: string
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - deviceToken: []
      summary: Download the app
      tags:
        - Device
  /availability-windows:
    get:
      description: List availability-windows with pagination, search (note), sorting (starts_at, ends_at, created_at, updated_at), and filters (media_item_id).
      operationId: list-availability-windows
      parameters:
        - description: Page size.
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size.
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: Rows to skip.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Rows to skip.
            format: int64
            minimum: 0
            type: integer
        - description: Free-text search across the resource's searchable columns.
          explode: false
          in: query
          name: q
          schema:
            description: Free-text search across the resource's searchable columns.
            type: string
        - description: Column to sort by (whitelisted per resource).
          explode: false
          in: query
          name: sort
          schema:
            description: Column to sort by (whitelisted per resource).
            type: string
        - description: Sort direction.
          explode: false
          in: query
          name: dir
          schema:
            default: asc
            description: Sort direction.
            enum:
              - asc
              - desc
            type: string
        - description: Exact-match filters as column:value pairs, e.g. filter=status:active. Repeatable.
          explode: true
          in: query
          name: filter
          schema:
            description: Exact-match filters as column:value pairs, e.g. filter=status:active. Repeatable.
            items:
              type: string
            type:
              - array
              - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageBodyAvailabilityWindow"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - adminKey: []
      summary: List availability-windows
      tags:
        - Availability Windows
    post:
      operationId: create-availability-window
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityWindowCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityWindow"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - adminKey: []
      summary: Create a availability-window
      tags:
        - Availability Windows
  /availability-windows/{id}:
    delete:
      operationId: delete-availability-window
      parameters:
        - description: Entity ID.
          in: path
          name: id
          required: true
          schema:
            description: Entity ID.
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - adminKey: []
      summary: Delete a availability-window
      tags:
        - Availability Windows
    get:
      operationId: get-availability-window
      parameters:
        - description: Entity ID.
          in: path
          name: id
          required: true
          schema:
            description: Entity ID.
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityWindow"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - adminKey: []
      summary: Get a availability-window
      tags:
        - Availability Windows
    patch:
      description: "Partial update: only provided fields are changed."
      operationId: update-availability-window
      parameters:
        - description: Entity ID.
          in: path
          name: id
          required: true
          schema:
            description: Entity ID.
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityWindowUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityWindow"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - adminKey: []
      summary: Update a availability-window
      tags:
        - Availability Windows
  /catalog:
    get:
      description: Media items with an availability window open right now whose play has not already been consumed.
      operationId: get-catalog
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - deviceToken: []
      summary: List available on-demand items
      tags:
        - Device
  /devices:
    get:
      description: List devices with pagination, search (name), sorting (name, kind, last_seen_at, paired_at, created_at, updated_at), and filters (kind).
      operationId: list-devices
      parameters:
        - description: Page size.
          explode: false
          in: query
          name: limit
          schema:
            default: 25
            description: Page size.
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: Rows to skip.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Rows to skip.
            format: int64
            minimum: 0
            type: integer
        - description: Free-text search across the resource's searchable columns.
          explode: false
          in: query
          name: q
          schema:
            description: Free-text search across the resource's searchable columns.
            type: string
        - description: Column to sort by (whitelisted per resource).
          explode: false
          in: query
          name: sort
          schema:
            description: Column to sort by (whitelisted per resource).
            type: string
        - description: Sort direction.
          explode: false
          in: query
          name: dir
          schema:
            default: asc
            description: Sort direction.
            enum:
              - asc
              - desc
            type: string
        - description: Exact-match filters as column:value pairs, e.g. filter=status:active. Repeatable.
          explode: true
          in: query
          name: filter
          schema:
            description: Exact-match filters as column:value pairs, e.g. filter=status:active. Repeatable.
            items:
              type: string
            type:
              - array
              - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageBodyDevice"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - adminKey: []
      summary: List devices
      tags:
        - Devices
    post:
      description: Creates an unpaired device and returns the pairing code to enter on the client.
      operationId: create-device
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - adminKey: []
      summary: Register a device
      tags:
        - Devices
  /devices/pair:
    post:
      description: Exchange a pairing code shown in the admin UI for a device token. Codes are single-use and expire.
      operationId: pair-device
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairResponse"
          description: Created
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Pair a device
      tags:
        - Device
  /devices/{id}:
    delete:
      operationId: delete-device
      parameters:
        - description: Entity ID.
          in: path
          name: id
          required: true
          schema:
            description: Entity ID.
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - adminKey: []
      summary: Delete a device
      tags:
        - Devices
    get:
